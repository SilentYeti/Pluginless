modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ldlib2"
    type="required"
    versionRange="[${ldlib2_version},)"
    ordering="AFTER"
    side="BOTH"

# The PDA app (1.21.1 only) is optional: without WFLib the ROTH terminal and the commands are the whole interface.
[[dependencies.${mod_id}]]
    modId="wflib"
    type="optional"
    versionRange="[1.8.36,)"
    ordering="AFTER"
    side="CLIENT"
