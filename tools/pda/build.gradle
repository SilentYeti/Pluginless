plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.248'
    runs {
        harness {
            if (project.property('mode') == 'server') {
                server()
                programArgument '--nogui'
            } else {
                client()
                programArguments.addAll('--username', 'PdaTester', '--quickPlayMultiplayer', "127.0.0.1:${project.property('port')}", '--width', '1280', '--height', '800')
            }
            gameDirectory = file(project.property('gameDir'))
            systemProperty 'pda.harness.control', project.property('controlDir')
            systemProperty 'pda.harness.longText', project.findProperty('longText') ?: 'false'
            systemProperty 'pluginless.pda.textaudit', 'true'
        }
    }
    mods { pdaharness { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly files(project.property('gemrenderJar'))
    implementation files(project.property('pluginlessJar'), project.property('wflibJar'))
    implementation files(project.property('ahfJar'), project.property('ldlibJar'))
    if (project.property('mode') == 'client') {
        runtimeOnly files(project.property('gemrenderJar'), project.property('flywheelJar'))
    }
}
