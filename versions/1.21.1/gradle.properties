deps.minecraft_range=[1.21.1,1.22)
java_version=21

# NeoForge and LDLib2 are kept in step with WarForge-Remaintained port/1.21.1 so the two load together.
deps.neoforge=21.1.248
deps.parchment=2024.11.17

# LDLib2 names its artifacts by Minecraft line (ldlib2-neoforge-1.21.1, -26.1, -26.2, -26.3).
deps.ldlib2_mc=1.21.1
deps.ldlib2=2.2.26
# The 1.21.1 line publishes its jar under the "all" classifier; 26.x publishes a plain jar.
deps.ldlib2_classifier=all
